name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check guitar_helper/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        # No-op until tests/ is populated; pytest exits 0 on empty suite
